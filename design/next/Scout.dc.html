<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes recceHover { 0%,100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(-0.4em) rotate(-1deg) } }
  @keyframes recceFly { 0%,100% { transform: translateY(0) rotate(-7deg) translateX(0) } 50% { transform: translateY(-0.25em) rotate(-5deg) translateX(0.2em) } }
  @keyframes recceBlink { 0%,93%,100% { transform: scaleY(1) } 96% { transform: scaleY(0.1) } }
  @keyframes recceScan { 0%,100% { transform: translateX(-0.45em) } 50% { transform: translateX(0.45em) } }
  @keyframes recceBeam { 0%,100% { opacity: .5; transform: rotate(-7deg) } 50% { opacity: 1; transform: rotate(7deg) } }
  @keyframes reccePulse { 0%,100% { opacity: .3; transform: scale(1) } 50% { opacity: 1; transform: scale(1.35) } }
  @keyframes recceFlame { 0%,100% { transform: scaleX(1) scaleY(1); opacity: .85 } 50% { transform: scaleX(1.35) scaleY(0.8); opacity: 1 } }
  @keyframes recceGlow { 0%,100% { opacity: .35; transform: scaleX(1) } 50% { opacity: .65; transform: scaleX(0.8) } }
  @keyframes recceTick { 0% { transform: rotate(45deg) scale(0) } 70% { transform: rotate(45deg) scale(1.2) } 100% { transform: rotate(45deg) scale(1) } }
  @keyframes recceSwing { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  @keyframes recceArrive { 0% { transform: translateY(0.6em) scale(0.96); opacity: .6 } 60% { transform: translateY(-0.25em) scale(1.02); opacity: 1 } 100% { transform: translateY(0) scale(1); opacity: 1 } }
</style>
</helmet>
<div title="{{ title }}" style="position:relative;width:10em;height:10.4em;font-size:{{ unit }}px;flex:none">
  <div style="position:absolute;left:2.4em;top:9.4em;width:5.2em;height:0.7em;border-radius:50%;background:{{ accent }};filter:blur(0.28em);opacity:{{ glowOpacity }};animation:{{ glowAnim }};transform-origin:center"></div>
  <div style="position:absolute;left:0;top:0.6em;width:10em;height:8.6em;animation:{{ bodyAnim }};transform-origin:5em 4.6em;transform:rotate({{ bodyTilt }})">
    <div style="position:absolute;left:5.1em;top:0.9em;width:0.3em;height:1.9em;border-radius:0.15em;background:#C4C4CC"></div>
    <div style="position:absolute;left:4.85em;top:0.45em;width:0.8em;height:0.8em;border-radius:50%;background:{{ accent }};opacity:{{ tipOpacity }};box-shadow:0 0 0.5em {{ accentGlow }};animation:{{ tipAnim }}"></div>
    <div style="position:absolute;left:1.5em;top:2.4em;width:2.6em;height:0.75em;border-radius:0.2em;background:#D2D2DA;box-shadow:inset 0 -0.18em 0 rgba(0,0,0,0.14);transform:rotate(-22deg);transform-origin:right center"></div>
    <div style="position:absolute;left:1.5em;top:5.2em;width:2.6em;height:0.75em;border-radius:0.2em;background:#D2D2DA;box-shadow:inset 0 -0.18em 0 rgba(0,0,0,0.14);transform:rotate(22deg);transform-origin:right center"></div>
    <sc-if value="{{ isOn }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:{{ flameLeft }};top:3.55em;width:{{ flameW }};height:1.3em;border-radius:50% 0 0 50% / 50% 0 0 50%;background:linear-gradient(270deg,{{ accent }} 0%,{{ accentGlow }} 55%,rgba(0,0,0,0) 100%);transform-origin:right center;animation:{{ flameAnim }}"></div></sc-if>
    <div style="position:absolute;left:2.8em;top:2.7em;width:6.4em;height:3em;border-radius:0.9em 1.6em 1.6em 0.9em;background:{{ shellColor }};box-shadow:inset -0.3em -0.4em 0 rgba(0,0,0,0.13), inset 0.15em 0.2em 0 rgba(255,255,255,0.4)"></div>
    <div style="position:absolute;left:5.5em;top:3.2em;width:3.3em;height:1.8em;border-radius:0.9em 1.2em 1.2em 0.9em;background:#111114;box-shadow:inset 0 0 0 0.1em rgba(255,255,255,0.08);overflow:hidden">
      <div style="position:absolute;left:1.15em;top:0.25em;width:1.3em;height:1.3em;border-radius:50%;background:{{ accent }};opacity:{{ irisOpacity }};animation:{{ irisAnim }};transform-origin:center;box-shadow:0 0 0.5em {{ accentGlow }}">
        <sc-if value="{{ isOn }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0.24em;top:0.2em;width:0.38em;height:0.38em;border-radius:50%;background:#FFFFFF;opacity:.95"></div></sc-if>
        <sc-if value="{{ isFound }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0.46em;top:0.16em;width:0.33em;height:0.66em;border-right:0.22em solid #101013;border-bottom:0.22em solid #101013;transform:rotate(45deg);animation:recceTick .4s cubic-bezier(.2,.7,.3,1.2) both"></div></sc-if>
      </div>
    </div>
    <div style="position:absolute;left:3.4em;top:3.5em;width:1.5em;height:0.45em;border-radius:0.22em;background:rgba(0,0,0,0.12)"></div>
    <div style="position:absolute;left:3.4em;top:4.3em;width:0.9em;height:0.45em;border-radius:0.22em;background:rgba(0,0,0,0.12)"></div>
    <sc-if value="{{ isLooking }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:8.4em;top:2.5em;width:3.6em;height:3.2em;background:linear-gradient(90deg,{{ accentGlow }},rgba(0,0,0,0));clip-path:polygon(0 42%,100% 0,100% 100%,0 58%);transform-origin:left center;animation:recceBeam 2.4s ease-in-out infinite"></div></sc-if>
    <sc-if value="{{ isLooking }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0.3em;top:2.2em;width:1.3em;height:0.22em;border-radius:0.11em;background:rgba(236,236,241,0.18)"></div><div style="position:absolute;left:0;top:6.4em;width:1em;height:0.22em;border-radius:0.11em;background:rgba(236,236,241,0.12)"></div></sc-if>
    <sc-if value="{{ isMission }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:5.85em;top:5.6em;width:0.25em;height:0.8em;background:#B9B9C3"></div>
      <div style="position:absolute;left:4.9em;top:6.3em;width:2.2em;height:2.2em;border-radius:0.35em;background:#ECECF1;box-shadow:0 0.2em 0.6em rgba(0,0,0,0.45), inset 0 0 0 0.08em rgba(0,0,0,0.12);animation:recceSwing 2.6s ease-in-out infinite;transform-origin:top center;padding:0.35em 0.3em;display:flex;flex-direction:column;gap:0.26em">
        <div style="height:0.28em;border-radius:0.14em;background:#D9B36A"></div>
        <div style="height:0.22em;border-radius:0.11em;background:rgba(19,19,22,0.35)"></div>
        <div style="height:0.22em;border-radius:0.11em;background:rgba(19,19,22,0.35);width:70%"></div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Scout&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Recce&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;looking&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;looking&quot;,&quot;found&quot;,&quot;thin&quot;,&quot;mission&quot;,&quot;off&quot;],&quot;tsType&quot;:&quot;'idle'|'looking'|'found'|'thin'|'mission'|'off'&quot;,&quot;section&quot;:&quot;Recce&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:16,&quot;max&quot;:240,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Recce&quot;}}">
// Recce is a scout probe: a pale forward-facing pod with a dark visor and one lens, two swept fins, a thin sensor mast with a light,
// and a thruster at the back. He hovers when he's on and leans in and flies when he's looking, a searchlight sweeping ahead.
// ONE colour at a time, and it says what he's doing — the same meanings as everywhere in the product:
//   teal = out, looking (sources) · green = found, verified · gold = a mission, something for you to grab · red = thin, nothing here · grey = off.
const COLOR = { idle: "#5EB8C9", looking: "#5EB8C9", found: "#5EC98F", mission: "#D9B36A", thin: "#E06A6A", off: "#3A3A44" };
const GLOW = { idle: "rgba(94,184,201,0.55)", looking: "rgba(94,184,201,0.55)", found: "rgba(94,201,143,0.55)", mission: "rgba(217,179,106,0.5)", thin: "rgba(224,106,106,0.4)", off: "transparent" };
const TITLES = { idle: " — hovering, waiting", looking: " — out looking, your footage first", found: " — found it, verified", thin: " — back; thin, nothing here on this", mission: " — one to grab", off: " — outside is off, grounded" };
class Component extends DCLogic {
  renderVals() {
    const st = COLOR[this.props.state] ? this.props.state : "idle", size = Number(this.props.size) || 48;
    const on = st !== "off", looking = st === "looking", found = st === "found", thin = st === "thin", mission = st === "mission";
    return {
      unit: (size / 10).toFixed(2), title: (this.props.nameOf || this.props.name || "Scout") + TITLES[st],
      isOn: on, isLooking: looking, isFound: found, isMission: mission,
      accent: COLOR[st], accentGlow: GLOW[st],
      bodyAnim: looking ? "recceFly 1s ease-in-out infinite" : found ? "recceArrive .5s cubic-bezier(.2,.7,.3,1.1) both, recceHover 3.2s ease-in-out .5s infinite" : on ? "recceHover " + (mission ? "2.2s" : "3.2s") + " ease-in-out infinite" : "none", bodyTilt: thin ? "8deg" : "0deg",
      shellColor: on ? "#E6E6EC" : "#5E5E68",
      irisOpacity: thin ? "0.45" : "1", irisAnim: looking ? "recceScan 2.4s ease-in-out infinite" : st === "idle" ? "recceBlink 4.8s ease-in-out infinite" : "none",
      tipOpacity: looking ? "1" : on ? "0.6" : "0.5", tipAnim: looking ? "reccePulse 1.1s ease-in-out infinite" : "none",
      flameW: looking ? "3.2em" : thin ? "1em" : "1.8em", flameLeft: looking ? "-0.4em" : thin ? "1.8em" : "1em", flameAnim: "recceFlame " + (looking ? ".2s" : ".5s") + " ease-in-out infinite",
      glowOpacity: on ? "0.5" : "0", glowAnim: on ? "recceGlow " + (looking ? "1s" : "3.2s") + " ease-in-out infinite" : "none",
    };
  }
}
</script>
</body>
</html>
