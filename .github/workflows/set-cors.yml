name: Set R2 CORS

# Standalone: sets the R2 bucket CORS policy (so the browser can upload direct)
# without a full container redeploy. Run via "Run workflow".
on:
  push:
    branches: [claude/aldershot-project-status-32ntv2]
    paths: [".github/workflows/set-cors.yml", "scripts/set-cors.mjs"]
  workflow_dispatch: {}

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set bucket CORS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/set-cors.mjs
