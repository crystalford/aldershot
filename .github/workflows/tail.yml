name: Tail live logs

# Captures live console.log/error output from the deployed Worker for a fixed
# window, so we can see exactly where a request is stalling in real time.
# Trigger this, then (within the window) reproduce the issue in the app.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to tail (seconds)"
        required: false
        default: "90"

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SECS="${{ github.event.inputs.seconds }}"
          echo "==> Tailing for ${SECS}s — reproduce the issue in the app now"
          timeout "${SECS}" npx wrangler tail --format pretty || true
          echo "==> Done"
