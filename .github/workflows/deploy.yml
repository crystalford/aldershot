name: Deploy to Cloudflare

# Runs on GitHub's servers (which can reach Cloudflare) and deploys Aldershot to
# your workers.dev subdomain. Add two repo secrets first:
#   CLOUDFLARE_API_TOKEN   — a scoped token (Edit Workers + D1:Edit + Workers AI:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — your account id
# Then this runs automatically on push to this branch (or via "Run workflow").

on:
  push:
    # main is the trunk and the default branch. Session branches do not deploy;
    # work reaches production by reaching main.
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # THE GATE, BEFORE ANYTHING TOUCHES CLOUDFLARE.
      #
      # This step did not exist. The job went from `npm install` straight to
      # provisioning and `wrangler deploy`, so a build that failed typecheck or
      # tests deployed anyway — in a repo whose CLAUDE.md says "nothing merges
      # red". The habit was real and nothing enforced it.
      #
      # Deliberately the non-strict gate. The two stages that need a running
      # dev server skip here and say so, which is right: booting wrangler and
      # seeding a fixture belongs in check.yml, which runs on this same push
      # and does exactly that. Everything else — typecheck, the full test
      # suite, the container's module graph, and every fidelity rule that
      # reads source rather than rendered HTML — runs, and a failure stops the
      # job before a single Cloudflare resource is touched.
      - name: The gate
        run: bash scripts/check.sh

      - name: Provision resources and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # R2_ACCOUNT_ID is the Cloudflare account id under another name —
          # see the put_secret line below. It is in this block so the job's
          # environment holds what it actually ships: without it,
          # scripts/deploy-readout.mjs looked for R2_ACCOUNT_ID, did not find
          # it, and printed "OFF Direct upload to storage" while the Worker had
          # the value and /api/preflight reported it on. Two reporters
          # disagreeing with nothing to say which was right.
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          # The bucket is created once and exists for ever after, so every
          # deploy since the first has printed a red API ERROR for the normal
          # case. `|| true` kept the run going but not the noise, and a log
          # that cries wolf on every green run is a log nobody reads — which
          # is exactly how a real failure two steps down goes unnoticed.
          #
          # Ask first. Anything other than "it is already there" is still a
          # genuine failure and still stops the deploy.
          echo "==> R2 bucket"
          if npx wrangler r2 bucket info aldershot-media >/dev/null 2>&1; then
            echo "  aldershot-media is there"
          else
            echo "  creating aldershot-media"
            npx wrangler r2 bucket create aldershot-media
          fi

          echo "==> D1 database (look up by name; create if missing)"
          find_id() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                let j; try { j=JSON.parse(s) } catch { j=[] }
                const a=Array.isArray(j)?j:(j.result||j.databases||[]);
                const db=a.find(d=>d.name==="aldershot")||{};
                process.stdout.write(db.uuid||db.database_id||db.id||"");
              })'
          }
          DB_ID="$(find_id)"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create aldershot
            DB_ID="$(find_id)"
          fi
          if [ -z "$DB_ID" ]; then echo "Could not resolve D1 id"; exit 1; fi
          echo "==> D1 id: $DB_ID"

          echo "==> Wiring database_id into wrangler.jsonc"
          node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.jsonc","utf8");s=s.replace(/("database_id":\s*")TODO(")/,`$1${process.argv[1]}$2`);fs.writeFileSync("wrangler.jsonc",s)' "$DB_ID"
          # tables are created lazily by ensureSchema() on first request — no migration step needed

          echo "==> Queues (ask about each one; create only what is absent)"
          # This was ten lines of inline shell that listed every queue, parsed
          # the JSON, and fell back to an empty list when the parse failed — so
          # every queue looked absent, the create was attempted, and Cloudflare
          # refused a name it already had. Deploy runs 237 and 238 both died
          # here in thirty seconds and two merges never reached production.
          #
          # It is a script now for the reason it went wrong: logic reachable
          # only by pushing to main is logic nothing can test. scripts/
          # ensure-queues.sh is driven by test/ensure-queues.test.ts with a
          # stub wrangler, including the taken-name error that broke those two
          # runs. Its header has the rest.
          bash scripts/ensure-queues.sh aldershot-jobs aldershot-jobs-dlq

          echo "==> Storage CORS (first, so it lands regardless of the deploy step)"
          node scripts/set-cors.mjs || true

          echo "==> Refusing to ship the auth bypass"
          # DEV_LOGIN_EMAIL treats every unauthenticated visitor as the owner.
          # It belongs in .dev.vars, which is never uploaded. If it has crept
          # back into the deployed config, stop here — shipping it would leave
          # the live site with no authentication at all.
          # Comments are stripped first: this file EXPLAINS why the var must not
          # be here, and a plain grep matched that explanation and failed every
          # deploy. Check what wrangler actually parses, not the prose.
          #
          # BOTH comment styles. Stripping only // was right until the config
          # grew /* */ blocks, at which point JSON.parse threw, the check failed
          # closed — correct — and reported "DEV_LOGIN_EMAIL is a real var",
          # which was not true and sent me looking in the wrong place. A guard
          # that cannot tell "unparseable" from "unsafe" wastes the failure it
          # just caused.
          #
          # And it has to know what a STRING is. The regex version did not, so
          # the /* inside "globs": ["**/*.woff2"] read as the start of a block
          # comment. That was harmless until the file grew a real block comment
          # later on — then the strip ran from the glob to that comment's */ and
          # ate the config in between. A valid file failed to parse, the deploy
          # stopped, and the reason pointed at a comment rather than at the
          # stripper. Walking the text is a few more lines and cannot do that.
          node -e '
            const fs=require("fs");
            const raw=fs.readFileSync("wrangler.jsonc","utf8");
            let out="", i=0, inStr=false;
            while (i < raw.length) {
              const c = raw[i], d = raw[i+1];
              if (inStr) {
                out += c;
                if (c === "\\") { out += raw[i+1] ?? ""; i += 2; continue; }
                if (c === "\"") inStr = false;
                i++; continue;
              }
              if (c === "\"") { inStr = true; out += c; i++; continue; }
              if (c === "/" && d === "*") { const e = raw.indexOf("*/", i+2); i = e < 0 ? raw.length : e+2; continue; }
              if (c === "/" && d === "/") { const e = raw.indexOf("\n", i); i = e < 0 ? raw.length : e; continue; }
              out += c; i++;
            }
            let cfg;
            try { cfg = JSON.parse(out); }
            catch (e) { console.error("PARSE " + e.message); process.exit(2); }
            if ("DEV_LOGIN_EMAIL" in (cfg.vars||{})) process.exit(1);
          '
          case $? in
            0) echo "  (no auth bypass in the deployed config)" ;;
            1) echo "DEV_LOGIN_EMAIL is a real var in wrangler.jsonc. It disables auth. Move it to .dev.vars."; exit 1 ;;
            *) echo "wrangler.jsonc could not be parsed, so the auth-bypass check could not run. Fix the config."; exit 1 ;;
          esac

          echo "==> Deploying"
          npx wrangler deploy

          echo "==> Secrets"
          put_secret() { if [ -n "${2:-}" ]; then printf '%s' "$2" | npx wrangler secret put "$1"; else echo "  (skip $1 — not set)"; fi; }
          put_secret R2_ACCOUNT_ID "${R2_ACCOUNT_ID:-}"
          put_secret R2_ACCESS_KEY_ID "${R2_ACCESS_KEY_ID:-}"
          put_secret R2_SECRET_ACCESS_KEY "${R2_SECRET_ACCESS_KEY:-}"
          # The address login links come from. Not a secret in any real sense
          # — it appears in every message — but it is per-deployment, so it
          # rides with the rest rather than being hardcoded.
          put_secret MAIL_FROM "${MAIL_FROM:-}"
          put_secret ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}"
          # APP_ORIGIN is NOT here any more: it is https://aldershot.io, a
          # public URL, and it is committed in wrangler.jsonc's vars. It used
          # to be a repo secret, which was a category error and also a hazard
          # — this step runs AFTER `wrangler deploy`, so a secret of that name
          # would land on top of the committed var and nothing in the repo
          # detects two sources for one name.
          put_secret GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
          put_secret GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}"
          # Billing. Absent until there is a Stripe account; every surface that
          # would offer to charge checks for them and shows nothing without.
          put_secret STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"
          put_secret STRIPE_PRICE_ID "${STRIPE_PRICE_ID:-}"
          put_secret STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-}"

          # Sessions are signed with this. src/auth.ts refuses to sign without
          # it rather than falling back to a constant, so a deploy that skipped
          # it would serve a site nobody could sign in to.
          #
          # Generated once and then left alone: rotating it invalidates every
          # session, so it is only written when absent.
          echo "==> Session secret"
          if npx wrangler secret list 2>/dev/null | grep -q SESSION_SECRET; then
            echo "  (already set — leaving it alone, rotating would sign everyone out)"
          else
            head -c 32 /dev/urandom | base64 | tr -d '\n' | npx wrangler secret put SESSION_SECRET
          fi

          # WHAT THIS DEPLOY ACTUALLY SWITCHED ON, said without being asked.
          #
          # /api/preflight is the readiness report and it is owner-only, so
          # reading it needs a session and getting a session needs the sign-in
          # it reports on. MAIL_FROM was empty for a month, nobody could sign
          # in to aldershot.io — including the owner — and the only way to find
          # that out was reading the tail of a failed deploy's log by hand.
          #
          # It prints names and states, never values, and test/
          # deploy-readout.test.ts feeds it secret-shaped input to hold that.
          node scripts/deploy-readout.mjs
