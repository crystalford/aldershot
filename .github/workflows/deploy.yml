name: Deploy to Cloudflare

# Runs on GitHub's servers (which can reach Cloudflare) and deploys Aldershot to
# your workers.dev subdomain. Add two repo secrets first:
#   CLOUDFLARE_API_TOKEN   — a scoped token (Edit Workers + D1:Edit + Workers AI:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — your account id
# Then this runs automatically on push to this branch (or via "Run workflow").

on:
  push:
    branches: [claude/aldershot-project-status-32ntv2]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Provision resources and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "==> R2 bucket (ok if it already exists)"
          npx wrangler r2 bucket create aldershot-media || true

          echo "==> D1 database (look up by name; create if missing)"
          find_id() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                let j; try { j=JSON.parse(s) } catch { j=[] }
                const a=Array.isArray(j)?j:(j.result||j.databases||[]);
                const db=a.find(d=>d.name==="aldershot")||{};
                process.stdout.write(db.uuid||db.database_id||db.id||"");
              })'
          }
          DB_ID="$(find_id)"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create aldershot
            DB_ID="$(find_id)"
          fi
          if [ -z "$DB_ID" ]; then echo "Could not resolve D1 id"; exit 1; fi
          echo "==> D1 id: $DB_ID"

          echo "==> Wiring database_id into wrangler.jsonc"
          node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.jsonc","utf8");s=s.replace(/("database_id":\s*")TODO(")/,`$1${process.argv[1]}$2`);fs.writeFileSync("wrangler.jsonc",s)' "$DB_ID"
          # tables are created lazily by ensureSchema() on first request — no migration step needed

          echo "==> Deploying (builds the ffmpeg container image too)"
          npx wrangler deploy

          echo "==> Direct-upload storage CORS + secrets"
          R2_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" node scripts/set-cors.mjs || true
          put_secret() { if [ -n "${2:-}" ]; then printf '%s' "$2" | npx wrangler secret put "$1"; else echo "  (skip $1 — not set)"; fi; }
          put_secret R2_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          put_secret R2_ACCESS_KEY_ID "${R2_ACCESS_KEY_ID:-}"
          put_secret R2_SECRET_ACCESS_KEY "${R2_SECRET_ACCESS_KEY:-}"
