name: Deploy to Cloudflare

# Runs on GitHub's servers (which can reach Cloudflare) and deploys Aldershot to
# your workers.dev subdomain. Add two repo secrets first:
#   CLOUDFLARE_API_TOKEN   — a scoped token (Edit Workers + D1:Edit + Workers AI:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — your account id
# Then this runs automatically on push to this branch (or via "Run workflow").

on:
  push:
    branches: [claude/aldershot-project-status-32ntv2]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Provision resources and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          echo "==> R2 bucket (ok if it already exists / needs enabling)"
          npx wrangler r2 bucket create aldershot-media || true

          echo "==> D1 database"
          if ! npx wrangler d1 info aldershot >/dev/null 2>&1; then
            npx wrangler d1 create aldershot
          fi
          DB_ID="$(npx wrangler d1 info aldershot --json \
            | node -pe 'const d=JSON.parse(require("fs").readFileSync(0)); d.uuid||d.database_id||""')"
          if [ -z "$DB_ID" ]; then echo "Could not read D1 id"; exit 1; fi
          echo "==> Wiring database_id into wrangler.jsonc"
          node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.jsonc","utf8");s=s.replace(/("database_id":\s*")TODO(")/,`$1${process.argv[1]}$2`);fs.writeFileSync("wrangler.jsonc",s)' "$DB_ID"

          echo "==> Applying D1 migrations (schema also self-heals via ensureSchema)"
          npx wrangler d1 migrations apply aldershot --remote || true

          echo "==> Deploying"
          npx wrangler deploy
