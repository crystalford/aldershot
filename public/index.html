<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aldershot · Transcript Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
        <g fill="none" stroke="#F2A93B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
          <circle cx="60" cy="60" r="45" stroke-opacity="0.5" />
          <path d="M74.7,68.5 L60,77 L45.3,68.5 L45.3,51.5 L60,43 L74.7,51.5 Z" />
          <path d="M104,60 L74.7,68.5" /><path d="M82,98.1 L60,77" />
          <path d="M38,98.1 L45.3,68.5" /><path d="M16,60 L45.3,51.5" />
          <path d="M38,21.9 L60,43" /><path d="M82,21.9 L74.7,51.5" />
        </g>
      </svg>
      <span>ALDERSHOT</span>
      <em>Transcript Editor</em>
    </div>
    <div class="stats" id="stats">no transcript</div>
  </header>

  <main>
    <section class="left">
      <video id="video" controls playsinline></video>
      <div class="controls">
        <label class="btn">Load video<input id="file" type="file" accept="video/*,audio/*" hidden /></label>
        <button class="btn" id="transcribe">Transcribe</button>
        <button class="btn ghost" id="demo">Demo transcript</button>
        <button class="btn amber" id="playEdit">▶ Play edit</button>
        <button class="btn amber" id="export">Export</button>
      </div>
      <div class="meta"><span id="filename">no file</span><span id="status"></span></div>
      <p class="hint">Click a word to cut it. Shift-click for a range. Double-click to jump there.</p>
    </section>

    <section class="right">
      <div id="transcript" class="transcript"><span class="empty">Load a video and Transcribe — or hit “Demo transcript” to feel the editor right now.</span></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
