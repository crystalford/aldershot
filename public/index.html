<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aldershot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Aldershot">
      <div class="rail-mark" id="railHome" role="button" tabindex="0" title="Aldershot">
        <span class="mark-tile">A</span>
      </div>
      <div class="rail-group" id="railTop"></div>
      <button class="rail-icon-btn" id="paletteTrigger" title="Search or jump to…">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-icon-btn" id="railNotif" title="Notifications"></button>
      <button class="rail-icon-btn" id="railHelp" title="Help"></button>
      <div class="rail-group" id="railBottom"></div>
      <div class="notif-panel" id="notifPanel" hidden></div>
    </nav>
    <div class="shell-main">
      <header class="bar">
        <nav class="crumbs" id="crumbs"></nav>
        <div class="stats" id="stats"></div>
        <div class="header-actions" id="headerActions"></div>
      </header>

      <main id="main"><div class="loading"><span class="spinner"></span> Loading…</div></main>
    </div>
  </div>

  <!-- shared hidden player used for cross-video edit preview -->
  <video id="player" playsinline style="display:none"></video>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="audio.js"></script>
  <script src="thumb.js"></script>
  <script src="render.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
