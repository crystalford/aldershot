<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aldershot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Aldershot">
      <div class="rail-mark" id="railHome" role="button" tabindex="0" title="Aldershot">
        <span class="mark-tile">
          <svg width="14" height="17" viewBox="0 0 12 14" fill="none" aria-hidden="true"><path d="M0 0.8C0 0.06 0.83-0.36 1.44 0.04L11.2 6.24C11.75 6.59 11.75 7.41 11.2 7.76L1.44 13.96C0.83 14.36 0 13.94 0 13.2V0.8Z" fill="#fff"/></svg>
        </span>
      </div>
      <div class="rail-group" id="railTop"></div>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="railNotif" title="Notifications"></button>
      <button class="rail-btn" id="railHelp" title="Help"></button>
      <div class="rail-group" id="railBottom"></div>
      <div class="notif-panel" id="notifPanel" hidden></div>
    </nav>
    <div class="shell-main">
      <header class="bar">
        <button class="palette-trigger" id="paletteTrigger" title="Search or jump to…">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search or jump to…</span>
        </button>
        <nav class="crumbs" id="crumbs"></nav>
        <div class="stats" id="stats"></div>
        <div class="header-actions" id="headerActions"></div>
      </header>

      <main id="main"><div class="loading"><span class="spinner"></span> Loading…</div></main>
    </div>
  </div>

  <!-- shared hidden player used for cross-video edit preview -->
  <video id="player" playsinline style="display:none"></video>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="audio.js"></script>
  <script src="thumb.js"></script>
  <script src="render.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
